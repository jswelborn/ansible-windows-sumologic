---
- name: Check and remediate Windows SumoLogic Collector service
  hosts: all
  gather_facts: false

  vars:
    service_name: sumo-collector

  tasks:
    - name: Gather SumoLogic Collector service info
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: sumologic_service_info
      ignore_unreachable: true
      failed_when: false

    - name: End compliance check when service information could not be gathered
      ansible.builtin.meta: end_host
      when:
        - sumologic_service_info.unreachable | default(false) or
          sumologic_service_info.failed | default(false)

    - name: Fail if SumoLogic Collector service is missing
      ansible.builtin.fail:
        msg: "SumoLogic Collector service is missing"
      when:
        - not sumologic_service_info.exists | default(false)

    - name: Start SumoLogic Collector service when it is stopped
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: started
        start_mode: auto
      when:
        - sumologic_service_info.exists
        - sumologic_service_info.services[0].state != "started"

    - name: Refresh SumoLogic Collector service info after remediation
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: sumologic_remediation_info
      ignore_unreachable: true
      failed_when: false

    - name: End compliance check when service information could not be refreshed
      ansible.builtin.meta: end_host
      when:
        - sumologic_remediation_info.unreachable | default(false) or
          sumologic_remediation_info.failed | default(false)

    - name: Fail if SumoLogic Collector service is still not running
      ansible.builtin.fail:
        msg: "SumoLogic Collector service exists but could not be started"
      when:
        - sumologic_remediation_info.exists | default(false)
        - sumologic_remediation_info.services[0].state != "started"
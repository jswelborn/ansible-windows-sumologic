---
- name: Install Sumo Logic Collector on Windows
  hosts: all
  gather_facts: false

  vars_files:
    - vars/sumologic.yaml

  pre_tasks:
    - name: Set Kerberos password variable
      ansible.builtin.set_fact:
        kerberos_password: "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"

    - name: Obtain Kerberos ticket
      ansible.builtin.shell: |
        printf '%s\n' "{{ kerberos_password }}" | /usr/bin/kinit -V "{{ ansible_user }}"
      delegate_to: localhost
      changed_when: false
      no_log: true

    - name: Gather Windows facts
      ansible.windows.setup:

    - name: Validate Sumo Logic environment
      ansible.builtin.assert:
        that:
          - sumologic_environment is defined
          - sumologic_environment in ['staging', 'production']
        fail_msg: "sumologic_environment must be staging or production."

    - name: Set ephemeral behavior
      ansible.builtin.set_fact:
        sumologic_ephemeral: "{{ true if sumologic_environment == 'staging' else false }}"

    - name: Validate Sumo Logic access ID
      ansible.builtin.assert:
        that:
          - sumologic_accessid is defined
          - sumologic_accessid | trim | length > 0
        fail_msg: "sumologic_accessid must be provided by AAP credential."
      when: not sumologic_local_mode
      no_log: true

    - name: Validate Sumo Logic access key
      ansible.builtin.assert:
        that:
          - sumologic_accesskey is defined
          - sumologic_accesskey | trim | length > 0
        fail_msg: "sumologic_accesskey must be provided by AAP credential."
      when: not sumologic_local_mode
      no_log: true

  tasks:
    - name: Check if Sumo Collector is installed
      ansible.windows.win_shell: |
        $collector = Get-ItemProperty `
          HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, `
          HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* `
          -ErrorAction SilentlyContinue |
          Where-Object { $_.DisplayName -match "Sumo Logic Collector" }

        if ($collector) { "installed" } else { "missing" }
      register: sumologic_windows_check
      changed_when: false

    - name: Stop play if already installed
      ansible.builtin.meta: end_play
      when: sumologic_windows_check.stdout | trim == "installed"

    - name: Ensure install directory exists
      ansible.windows.win_file:
        path: "{{ sumologic_install_dir }}"
        state: directory

    - name: Ensure config directory exists
      ansible.windows.win_file:
        path: "{{ sumologic_config_dir }}"
        state: directory

    - name: Set installer path
      ansible.builtin.set_fact:
        os_package_local_path: "{{ sumologic_install_dir }}\\{{ sumologic_windows_installer }}"

    - name: Download Sumo Logic installer
      ansible.windows.win_get_url:
        url: "{{ sumologic_windows_download_url }}"
        dest: "{{ os_package_local_path }}"

    - name: Set collector name
      ansible.builtin.set_fact:
        sumologic_collector_name: "{{ ansible_hostname }}"

    - name: Copy Sumo sources config
      ansible.windows.win_copy:
        src: windows_sumo.json
        dest: "{{ sumologic_json_path }}"

    - name: Install Sumo Logic Collector
      ansible.windows.win_command:
        argv:
          - "{{ os_package_local_path }}"
          - "-q"
          - "-dir"
          - "{{ sumologic_install_dir }}"
          - "-Vsumo.accessid={{ sumologic_accessid }}"
          - "-Vsumo.accesskey={{ sumologic_accesskey }}"
          - "-VskipRegistration=true"
        creates: "{{ sumologic_install_dir }}\\collector.exe"
      async: 1800
      poll: 30
      no_log: true

    - name: Wait for Sumo collector service to exist
      ansible.windows.win_service_info:
        name: sumo-collector
      register: sumologic_service_info
      retries: 18
      delay: 10
      until:
        - sumologic_service_info.exists

    - name: Deploy user.properties
      ansible.windows.win_template:
        src: user.properties.j2
        dest: "{{ sumologic_user_properties_path }}"
      no_log: true

    - name: Ensure Sumo collector service starts automatically
      ansible.windows.win_service:
        name: sumo-collector
        start_mode: auto

    - name: Allow Sumo collector service registration to settle
      ansible.builtin.pause:
        seconds: 30

    - name: Restart Sumo collector service
      ansible.windows.win_service:
        name: sumo-collector
        state: restarted
      register: sumologic_restart_result
      retries: 6
      delay: 15
      until: sumologic_restart_result is succeeded
      when: not sumologic_local_mode

    - name: Ensure Sumo collector service is running
      ansible.windows.win_service:
        name: sumo-collector
        state: started
      register: sumologic_service_start_result
      retries: 6
      delay: 15
      until: sumologic_service_start_result is succeeded
      when: not sumologic_local_mode